[project]
name = "baduk-lab"
version = "0.0.1"
description = "A swing lab for serious amateur Go players: batch KataGo analysis, weakness diagnosis, personalized problem sets."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "sgfmill>=1.1.1",
    "xgboost>=2.0",
]

[project.scripts]
baduk-lab = "baduk_lab.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
